# Single entry point for local operations.
#
# Remaining stubs (local:status, drill:drain) print what they will do; every
# other task runs the real command. token and chat stopped being stubs on
# 2026-08-19 and now call tools/token.sh and tools/chat.sh. `test:smoke`,
# `test:contract`, and `lint` were wired to their real commands in Task 12,
# because tests/smoke, tests/contract, and every overlay this repository has
# at that point already exist and need no cluster to build or parse.
#
# go-task 3.53.1 (confirmed on this machine, 2026-08-19) fails to parse any
# `cmds` list entry whose string contains a colon followed by a space, even
# inside quotes (`echo "hello: world"` and `echo 'hello: world'` both error
# "invalid keys in command" - this is go-task's own command-shorthand
# detection, not a YAML parsing rule; plain YAML allows a quoted colon
# anywhere). Every stub message below uses " - " instead of ": " for exactly
# this reason; using a colon here breaks `task --list` for the whole file, not
# just the one task.

version: "3"

vars:
  CLUSTER_NAME: llm-serving-stack
  NAMESPACE: llm
  HOSTNAME: llm.localtest.me

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  preflight:
    desc: Check tools and Docker resources before installing anything
    cmds:
      - ./prereqs/preflight.sh

  helm:repos:
    desc: Add and update every Helm repository the platform install scripts use
    # Every platform/*/install.sh names a chart by repo alias
    # (jetstack/cert-manager, istio/base, argo/argo-cd, ...). Nothing else in
    # this repository ever ran `helm repo add`, so on a clean machine
    # `task local:up` used to die at platform/50-argocd/install.sh with
    # "Error: repo argo not found". The same gap applied to all eight aliases
    # below. KServe's charts are pulled by OCI reference and need no alias.
    #
    # kyverno was added on 2026-08-19. The original build plan named
    # `helm repo add kyverno https://kyverno.github.io/kyverno` and the alias
    # was dropped in implementation, so platform/12-kyverno/install.sh had no
    # alias to install from and CI could not install the policy engine at all.
    # (That plan is docs/superpowers/plans/2026-08-17-phase-1-local-stack.md
    # line 144 - a local working document, not in git, so the line is quoted
    # here rather than only cited.)
    #
    # Idempotent: `helm repo add --force-update` overwrites an existing entry
    # instead of failing, so re-running this task is always safe.
    # URLs checked 2026-08-19 (HTTP 200 on <url>/index.yaml for all eight).
    cmds:
      - helm repo add jetstack https://charts.jetstack.io --force-update
      - helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
      - helm repo add kedacore https://kedacore.github.io/charts --force-update
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
      - helm repo add kuadrant https://kuadrant.io/helm-charts --force-update
      - helm repo add argo https://argoproj.github.io/argo-helm --force-update
      - helm repo add kyverno https://kyverno.github.io/kyverno/ --force-update
      - helm repo update

  # --- local lifecycle -----------------------------------------------------

  local:up:
    desc: Empty machine to a ready service (phase 1)
    # helm:repos runs before every cmd below, so preflight (a dep of
    # local:cluster) can check the aliases exist rather than only that the
    # helm binary does.
    deps: [helm:repos]
    cmds:
      - task: local:cluster
      - ./platform/50-argocd/install.sh
      # --context, not bare kubectl. local:cluster has a `status:` guard, so on
      # a machine that already has the cluster this task starts here, with
      # whatever context happened to be current. On this machine that has been
      # `docker-desktop`; bench/recovery-drill.sh:16-27 carries the same fix and
      # the reason.
      - kubectl --context kind-{{.CLUSTER_NAME}} apply -f clusters/local-kind/root-app.yaml
      # This was an inline `kubectl wait --for=jsonpath='{.status.health.status}'=Healthy
      # applications.argoproj.io --all --timeout=30m` until 2026-08-20. On the
      # first run the pull path ever had, that line exited 0 in ONE SECOND with
      # zero child Applications created and nothing deployed, because an Argo CD
      # Application that failed to read its git path still reports
      # `health.status: Healthy`. The script asserts sync status, the child
      # count, and health, in that order. Its header holds the full record.
      - ./clusters/local-kind/wait-for-sync.sh 30m
      # Applications green is not a ready service. Run 3 on 2026-08-20 got
      # all sixteen Synced and Healthy while the gateway served an
      # unauthenticated caller, because the Kuadrant operator had started
      # before the Gateway API CRDs and never recovers from that on its own.
      - ./clusters/local-kind/verify-serving.sh

  local:cluster:
    desc: Create the kind cluster
    deps: [preflight]
    cmds:
      - kind create cluster --config prereqs/kind-cluster.yaml
    status:
      - kind get clusters | grep -qx {{.CLUSTER_NAME}}

  local:down:
    desc: Delete the local cluster
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}}

  local:status:
    desc: Show what is running and what is not ready
    cmds:
      - echo "TODO - summarise pods, gateway, InferenceService conditions"

  # --- using the service ---------------------------------------------------

  token:
    desc: Print a JWT from Keycloak (task token -- llm-tier-free)
    # The grant lives in tools/token.sh, not here. go-task 3.53.1 rejects a
    # colon followed by a space inside a cmds string, and an
    # `Authorization: Bearer` header contains one - see the header comment on
    # that script for the confirmation.
    cmds:
      - ./tools/token.sh {{.CLI_ARGS}}

  chat:
    desc: Send one streaming chat completion (task chat -- "your prompt")
    cmds:
      - ./tools/chat.sh {{.CLI_ARGS}}

  # --- verification --------------------------------------------------------

  test:smoke:
    desc: End-to-end checks, including 401 and 429 paths
    cmds:
      - bats tests/smoke

  test:contract:
    desc: Assert the engine contract, so engines stay swappable
    cmds:
      - bats tests/contract

  lint:
    desc: Build every overlay, check version pins, check Argo CD sync waves
    cmds:
      - for o in models/*/overlays/*; do kustomize build "$o" >/dev/null || exit 1; done
      - '[ "$(yq -r ".. | select(type == \"!!str\") | select(. == \"\")" versions.yaml | wc -l)" -eq 0 ]'
      # Added 2026-08-19. tests/smoke/10-gitops.bats asserts the same property
      # against live Application objects and has never run anywhere, so until
      # now nothing checked it at all. This form needs no cluster.
      - ./clusters/local-kind/check-sync-waves.sh
      # Every tracked shell script must be mode 100755 in GIT, not merely on the
      # machine that wrote it. Added 2026-08-19 after the first real run of the
      # imperative path, which died with
      #   ./platform/50-argocd/install.sh - Permission denied
      # That file alone was 100644 while the other fifteen were 100755, so
      # `task local:up` failed at its SECOND command on any fresh clone. No
      # static check found it in four review passes, because a file mode is not
      # file content - only running it, or this check, can.
      #
      # `git ls-files -s`, not `test -x`. The working tree can have the bit
      # while the index does not; on this repository's volume `chmod +x` alone
      # did not update the index and `git update-index --chmod=+x` was needed.
      # A clone reads the index, so the index is what must be right.
      # Two things this must do that the first version did not. It must FAIL when
      # git is unavailable or we are outside a work tree - `wc -l` prints 0 for
      # empty input, so any upstream failure read as "no offenders". And it must
      # name the file, because the whole point is that a reader cannot see a file
      # mode; the old form printed only the pipeline and left them to rerun it by
      # hand. Both confirmed by running, 2026-08-20.
      #
      # No colon-space anywhere in these strings, per the go-task trap this file
      # documents at the top.
      - git rev-parse --is-inside-work-tree > /dev/null
      - 'bad="$(git ls-files -s ''*.sh'' | awk ''$1 != "100755" {print $4}'')"; [ -z "$bad" ] || { printf ''not mode 100755 in the git index, run git update-index --chmod=+x on\n%s\n'' "$bad" >&2; exit 1; }'

  policy:
    desc: Run admission policies locally, the same ones the cluster enforces
    cmds:
      - kyverno test policy/tests

  # --- measurement ---------------------------------------------------------

  bench:
    desc: Run every scenario and write a dated result directory
    cmds:
      - ./bench/run.sh

  drill:recovery:
    desc: Delete the namespace, let Argo CD rebuild, measure time to first token
    cmds:
      - ./bench/recovery-drill.sh

  drill:drain:
    desc: Drain a node and assert the service stays available
    cmds:
      - echo "TODO - see docs/runbooks/node-drain.md for the commands"
