# Runtime plug-in. Nothing about a specific model belongs in this file: the
# model name, the served alias, and the weights it loads all live under
# models/ornith-9b/. Swapping models must never touch this file.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: llamacpp-arm64
  namespace: llm
spec:
  supportedModelFormats:
    - name: gguf
      version: "1"
      autoSelect: false
  # protocolVersions is deliberately ABSENT, not set to ["v2"].
  #
  # The field enumerates KServe's own open inference protocol versions - the
  # doc comment on the field at tag v0.20.0 reads "Supported protocol
  # versions (i.e. v1 or v2 or grpc-v1 or grpc-v2)"
  # (pkg/apis/serving/v1alpha1/servingruntime_types.go:140, read 2026-08-19).
  # llama.cpp implements none of them: it serves the OpenAI API
  # (/v1/chat/completions, /v1/completions, /v1/models), which is what
  # tests/contract/01-openai-api.bats asserts. Declaring "v2" claimed a
  # protocol this engine does not speak, and there is no enumerated value
  # that means "OpenAI", so the honest form is to omit the field.
  #
  # Omitting it is also functionally correct here.
  # ServingRuntimeSpec.IsProtocolVersionSupported (same file, line 304)
  # returns true when the list is empty, and this repository's
  # InferenceServices name the runtime explicitly
  # (spec.predictor.model.runtime: llamacpp-arm64) rather than relying on
  # protocol-based selection, so nothing depended on the old value.
  containers:
    - name: kserve-container
      # Pinned digest, read from versions.yaml (images.llamacpp_server) on
      # 2026-08-19. This is not a placeholder: the value below is the same
      # string `yq -r '.images.llamacpp_server' versions.yaml` prints.
      image: ghcr.io/ggml-org/llama.cpp:server-b10481@sha256:5be603b8cbf1ee9e078232ae5e1d02794e7540e210299b53bac04cbc6debc77b
      # No --alias here: the served model name is a per-model fact and belongs
      # in the model's own InferenceService (spec.predictor.model.args), which
      # KServe appends to this list. Naming a specific model in this runtime
      # would violate the one thing this file exists to guarantee: swapping
      # models touches models/, never runtimes/.
      args:
        - --model
        - /models/model.gguf
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --ctx-size
        - "4096"
        - --parallel
        - "2"
        - --metrics            # exposes /metrics in Prometheus format
      ports:
        # The name matters: the PodMonitor in Task 7 selects the port by name.
        - name: http
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        # /health reports ready only once weights are loaded, which is the
        # contract requirement. A TCP check would lie here.
        httpGet: { path: /health, port: 8080 }
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 120
      livenessProbe:
        httpGet: { path: /health, port: 8080 }
        initialDelaySeconds: 120
        periodSeconds: 30
      volumeMounts:
        - { name: models, mountPath: /models }
      # No `resources` here. Memory for a model server is a fact about the
      # model: weights plus the KV cache for --ctx-size. Sizing it here made
      # every model inherit ornith-9b's 8Gi, which is why fallback.yaml had to
      # override it to 1Gi. Each overlay under models/*/ sets its own, and
      # policy/require-resource-limits.yaml rejects a Pod that sets none.
