# Wave 4, alongside the model: the AuthPolicy and TokenRateLimitPolicy both
# target the ornith-9b HTTPRoute the model overlay creates, so this
# Application must not sync before it exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: llm }
  source:
    repoURL: https://github.com/namphuongtran/llm-serving-stack
    targetRevision: HEAD
    path: security/oidc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
