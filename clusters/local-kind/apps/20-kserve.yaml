# Wave 2. Exactly two charts, in order: kserve-crd, then kserve-resources
# (versions.yaml kserve.charts is the ordered install list; the other eight
# published charts live under kserve.charts_available and are not installed
# in phase 1). Multi-source `sources:` rather than two separate Applications:
# both charts land in the same wave, and Argo CD's own resource ordering
# within one sync applies by kind before by declaration order, with
# CustomResourceDefinition (kserve-crd's only output) ordered ahead of
# Deployment/Service (kserve-resources' output) - confirmed against Argo CD's
# documented sync behaviour, 2026-08-19. No cluster exists here to watch it
# happen; if this ordering assumption is wrong, splitting into two
# Applications at waves 2 and 3 is the fallback (Argo CD's own crd-before-cr
# guidance recommends exactly that as the more explicit alternative).
#
# repoURL/chart split per Argo CD's public-OCI-chart convention: no oci://
# prefix on repoURL, the chart name is a separate field, confirmed against
# Argo CD's own Helm documentation, 2026-08-19.
#
# kserve-resources' values are the same keys as
# platform/20-kserve/values-kserve.yaml, copied here rather than referenced:
# an Argo CD Application is a single git object and cannot read a values file
# from a second source without a `$values` ref this repository does not use
# elsewhere. Bumping values-kserve.yaml means updating valuesObject below
# too - the same known limitation recorded on 00-gateway-api-crds.yaml for
# version pins, extended to values content.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: kserve }
  sources:
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-crd
      targetRevision: v0.20.0
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-resources
      targetRevision: v0.20.0
      helm:
        valuesObject:
          kserve:
            controller:
              # Twin of platform/20-kserve/values-kserve.yaml, which carries
              # the reason this is Standard and not the legacy alias.
              deploymentMode: Standard
              gateway:
                # See platform/20-kserve/values-kserve.yaml for why this is
                # true: KServe's generated HTTPRoutes use a hostname the
                # single Gateway listener does not match, and they would
                # carry neither the Kuadrant policies nor the streaming
                # timeouts. With ingress creation disabled KServe marks
                # IngressReady true directly and this repository's own
                # HTTPRoute is the only route to the model.
                disableIngressCreation: true
                ingressGateway:
                  enableGatewayApi: true
                  className: istio
                  # kserveGateway and gateway are two different chart keys.
                  # kserveGateway becomes .data.ingress.kserveIngressGateway
                  # in the inferenceservice-config ConfigMap and is the one
                  # KServe reads under enableGatewayApi: true; `gateway`
                  # becomes .data.ingress.ingressGateway (the legacy Istio
                  # path). Both are set, to the same Gateway this repository
                  # creates, so the GitOps path and
                  # platform/20-kserve/values-kserve.yaml cannot drift.
                  kserveGateway: istio-system/llm
                  gateway: istio-system/llm
            # The model agent image, pinned by digest. Copied from
            # platform/20-kserve/values-kserve.yaml on 2026-08-19, which carries
            # the full reasoning: KServe injects this container for any
            # InferenceService with no storageUri, the chart leaves its tag
            # empty, and the resulting floating tag was rejected at admission by
            # this repository's own disallow-floating-tags policy.
            #
            # Changing the digest means changing it in both places. Grep for the
            # old one.
            agent:
              image: kserve/agent
              tag: "v0.20.0@sha256:17db4be84440fc92e27dc3e7cac706514ff555ba6fd942424f4d219e2c58930e"
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 20
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
