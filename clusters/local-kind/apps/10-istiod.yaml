# Wave 1. The rendered copy of platform/10-istio/helm/values-istiod.yaml. An
# Argo CD Application cannot read a values file out of this repository, so the
# two must change together - grep for otel-collector.observability.
#
# This used to be `helm.parameters` with a single profile=ambient entry.
# meshConfig.extensionProviders is a list of objects, which parameters cannot
# express, so it became valuesObject, the same form
# clusters/local-kind/apps/30-observability.yaml already uses.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      valuesObject:
        profile: ambient
        meshConfig:
          extensionProviders:
            - name: otel-tracing
              opentelemetry:
                service: otel-collector.observability.svc.cluster.local
                port: 4317
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
