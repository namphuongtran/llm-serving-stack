# Wave 4. Kustomize path source; kustomize build already renders the
# InferenceService, ServingRuntime, HTTPRoute, ScaledObject, PDB, and
# fetch-weights init container.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: llm }
  source:
    repoURL: https://github.com/namphuongtran/llm-serving-stack
    # Not HEAD - this remote's default branch holds an unrelated project.
    # The full record is on clusters/local-kind/root-app.yaml's own
    # targetRevision, found 2026-08-20 on the first real run of the pull path.
    targetRevision: rebuild/llm-serving-stack
    path: models/ornith-9b/overlays/local
  syncPolicy:
    automated: { prune: true, selfHeal: true }
