# The single object `task local:up` applies by hand (platform/50-argocd's own
# install is the only other imperative step). Every other Application in
# clusters/local-kind/apps/ is this Application's child: Argo CD reads the
# directory, creates each Application it finds, and each of those in turn
# syncs its own sources by its own sync-wave. One apply brings in everything.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  source:
    repoURL: https://github.com/namphuongtran/llm-serving-stack
    # `main`, not `HEAD`. HEAD resolves to the remote default branch, and until
    # 2026-08-20 that branch held an unrelated project - see
    # docs/deployment-walkthrough.md, "The pull-based path".
    targetRevision: main
    path: clusters/local-kind/apps
    directory:
      recurse: false
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # A failed sync is never retried without this, and sync waves gave only 12
    # seconds of ordering. Both measured 2026-08-20, see the walkthrough.
    retry:
      limit: 20
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    # ServerSideApply, set on every Application. Client-side apply writes the
    # whole manifest into last-applied-configuration, and Kubernetes caps that
    # annotation at 262144 bytes. On 2026-08-20 five of these fifteen charts
    # exceeded it: kserve, kyverno, kuadrant, observability, keda.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
