apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ornith-9b
  namespace: llm
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # KServe's default autoscaler class is HPA (constants.go at tag v0.20.0,
    # read 2026-08-19: `DefaultAutoscalerClass = AutoscalerClassHPA`). Without
    # this annotation KServe creates its own HorizontalPodAutoscaler on the
    # generated predictor Deployment, and KEDA refuses a ScaledObject whose
    # scaleTargetRef is already owned by another HPA - so
    # models/ornith-9b/overlays/local/scaledobject.yaml would never become
    # Ready.
    #
    # "external", not "keda", of the four values in
    # constants.AutoscalerAllowedClassList (hpa, external, keda, none):
    #   - `keda` makes KServe's OWN keda reconciler
    #     (reconcilers/autoscaler/autoscaler_reconciler.go:95) generate a
    #     ScaledObject from the InferenceService spec. This repository writes
    #     its own ScaledObject, with a Prometheus trigger on
    #     llmstack:requests_waiting that the InferenceService spec cannot
    #     express, so a KServe-generated one would be a second, competing
    #     scaler.
    #   - `external` means "some controller outside KServe scales this".
    #     reconcilers/hpa/hpa_reconciler.go:252 `shouldCreateHPA` returns
    #     false unless the annotation is absent or "hpa" (its return is at
    #     :260), and :226 `shouldDeleteHPA` removes an HPA KServe already
    #     created once the class becomes external (its return is at :249) -
    #     so KServe creates nothing and cleans up after an upgrade from a
    #     cluster that ran without this annotation.
    #   - `none` behaves the same as external in both functions, but says
    #     "nothing scales this", which is false here.
    serving.kserve.io/autoscalerClass: external
spec:
  predictor:
    minReplicas: 1          # never zero by default: cold start is minutes
    # policy/require-labels.yaml needs app.kubernetes.io/part-of on the
    # generated Deployment, which this repository does not write directly:
    # KServe's RawDeployment reconciler generates that Deployment. Confirmed
    # at the source of the pinned v0.20.0 tag, not assumed, 2026-08-19:
    #   pkg/controller/v1beta1/inferenceservice/components/predictor.go,
    #   buildObjectMeta(): `predictorLabels := isvc.Spec.Predictor.Labels`,
    #   merged into the returned ObjectMeta via `utils.Union(...)`.
    #   pkg/controller/v1beta1/inferenceservice/reconcilers/deployment/
    #   deployment_reconciler.go, createRawDefaultDeployment(): the
    #   Deployment's own top-level `ObjectMeta: componentMeta` is that same
    #   value, used directly (not just on the pod template, which derives a
    #   modified copy from it). So a label set here reaches the Deployment
    #   object the policy actually inspects. Setting it here, not weakening
    #   the policy, is the fix Task 13's brief calls for.
    labels:
      app.kubernetes.io/part-of: llm-serving-stack
    model:
      modelFormat: { name: gguf }
      runtime: llamacpp-arm64
      # storageUri is OMITTED on purpose, in every overlay. Omitting the key
      # is what suppresses KServe's storage-initializer injection; an empty
      # string is NOT the same thing and does not suppress it.
      #
      # Read at the pinned v0.20.0 tag, 2026-08-19:
      #   pkg/controller/v1beta1/inferenceservice/components/predictor.go:116
      #   `if sourceURI := predictor.GetStorageUri(); sourceURI != nil {`
      # The guard is `!= nil`, not `!= ""`. `storageUri: ""` unmarshals into
      # a non-nil *string pointing at the empty string, so the guard passes,
      # addStorageInitializerAnnotations (same file, line 294) sets the
      # internal source-uri annotation to "", and the storage-initializer
      # injector then appends an init container plus a volumeMount named
      # `kserve-provision-location` at /mnt/models. The local overlay already
      # mounts a volume named `models` at /mnt/models, and KServe
      # de-duplicates mounts by volume NAME, not by path, so the pod would
      # carry two mounts at one path and the API server would reject it
      # inside the ReplicaSet, where the reason appears only in events.
      #
      # The reason for suppressing injection at all is unchanged (risk R1):
      # the initializer expects a model repository, not one GGUF file. The
      # fetch-weights init container in each overlay's patch fetches the file.
      # The friendly served name is a model fact, not a runtime fact: KServe
      # appends this to the ServingRuntime's args, so llama.cpp serves the
      # model as "ornith-9b" instead of the raw file path. If KServe's
      # arg-merging does not behave this way in practice (risk R2 in the
      # design spec), fall back to a fully custom predictor container here
      # and record that in a new ADR; the contract tests do not change either
      # way.
      args:
        - --alias
        - ornith-9b
