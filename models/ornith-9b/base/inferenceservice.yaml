apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ornith-9b
  namespace: llm
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1          # never zero by default: cold start is minutes
    # policy/require-labels.yaml needs app.kubernetes.io/part-of on the
    # generated Deployment, which this repository does not write directly:
    # KServe's RawDeployment reconciler generates that Deployment. Confirmed
    # at the source of the pinned v0.20.0 tag, not assumed, 2026-08-19:
    #   pkg/controller/v1beta1/inferenceservice/components/predictor.go,
    #   buildObjectMeta(): `predictorLabels := isvc.Spec.Predictor.Labels`,
    #   merged into the returned ObjectMeta via `utils.Union(...)`.
    #   pkg/controller/v1beta1/inferenceservice/reconcilers/deployment/
    #   deployment_reconciler.go, createRawDefaultDeployment(): the
    #   Deployment's own top-level `ObjectMeta: componentMeta` is that same
    #   value, used directly (not just on the pod template, which derives a
    #   modified copy from it). So a label set here reaches the Deployment
    #   object the policy actually inspects. Setting it here, not weakening
    #   the policy, is the fix Task 13's brief calls for.
    labels:
      app.kubernetes.io/part-of: llm-serving-stack
    model:
      modelFormat: { name: gguf }
      runtime: llamacpp-arm64
      # Left empty on purpose, in every overlay: a non-empty value would make
      # KServe inject its own storage-initializer, which expects a model
      # repository rather than one GGUF file (risk R1). The fetch-weights
      # init container in each overlay's patch fetches the file itself.
      storageUri: ""
      # The friendly served name is a model fact, not a runtime fact: KServe
      # appends this to the ServingRuntime's args, so llama.cpp serves the
      # model as "ornith-9b" instead of the raw file path. If KServe's
      # arg-merging does not behave this way in practice (risk R2 in the
      # design spec), fall back to a fully custom predictor container here
      # and record that in a new ADR; the contract tests do not change either
      # way.
      args:
        - --alias
        - ornith-9b
