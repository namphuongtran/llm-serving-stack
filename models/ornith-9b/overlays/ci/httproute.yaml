# No fallback backend here (the ci overlay has no fallback-small
# InferenceService): a single backendRef, otherwise identical to
# overlays/local/httproute.yaml. tests/smoke/06-auth-quota.bats and
# tests/contract/ both call http://llm.localtest.me/v1/... in CI, which
# needs this route to exist.
#
# Same name as the local overlay's route, and for the same reason: KServe
# generates its own HTTPRoute named llm/ornith-9b when enableGatewayApi is
# true, so this one must not claim that name. The AuthPolicy and
# TokenRateLimitPolicy in security/oidc/ target this name, and CI applies
# those two files directly (.github/workflows/ci.yml), so the two must
# agree.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ornith-9b-openai
  namespace: llm
spec:
  parentRefs: [{ name: llm, namespace: istio-system }]
  hostnames: ["llm.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: ornith-9b-predictor
          port: 80
      timeouts:
        request: 600s
        backendRequest: 600s
