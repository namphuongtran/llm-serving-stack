# The failover target behind ornith-9b. The spec's failure table promises
# that when the primary engine is unavailable, a weaker answer beats no
# answer; this InferenceService is that weaker answer. Same runtime
# (llamacpp-arm64), a 0.5B model instead of a 9B one, so it starts fast and
# fits comfortably alongside the primary's two replicas.
#
# Values below come from models/ornith-9b/base/model.yaml under model.ci.
# Written in directly, not templated, for the same reason the primary's
# fetch-weights env is written in directly: a sed step nobody runs would
# otherwise leave a placeholder in the committed file.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fallback-small
  namespace: llm
  annotations:
    # `Standard`, not `RawDeployment`; see the note on the same annotation in
    # models/ornith-9b/base/inferenceservice.yaml.
    serving.kserve.io/deploymentMode: Standard
    # Same reasoning as models/ornith-9b/base/inferenceservice.yaml. No
    # ScaledObject targets fallback-small, but KServe would still create an
    # HPA on its predictor Deployment without this; "external" keeps the two
    # InferenceServices in this repository consistent about who owns replica
    # count.
    serving.kserve.io/autoscalerClass: external
spec:
  predictor:
    minReplicas: 1
    # Same reasoning as ornith-9b/base/inferenceservice.yaml: policy/require-
    # labels.yaml matches every Deployment/StatefulSet in namespace llm, with
    # no name filter, so fallback-small-predictor needs this label too.
    labels:
      app.kubernetes.io/part-of: llm-serving-stack
    model:
      modelFormat: { name: gguf }
      runtime: llamacpp-arm64
      # Same reasoning as ornith-9b/base/inferenceservice.yaml: the key is
      # OMITTED, not set to "". KServe's guard is `sourceURI != nil`
      # (pkg/controller/v1beta1/inferenceservice/components/predictor.go:116
      # at tag v0.20.0, read 2026-08-19), so an empty string is a non-nil
      # pointer and would still trigger storage-initializer injection. Only the
      # absent key is nil.
      #
      # This said the injection "makes the pod unschedulable". Corrected
      # 2026-08-20 on two counts. The observed failure was at pod CREATION, not
      # scheduling: `spec.containers[0].volumeMounts[2].mountPath: Invalid value:
      # "/mnt/models": must be unique`. And that particular collision is gone
      # anyway, because our volume moved to /models. The reason to keep omitting
      # storageUri is that the initializer expects a model repository and this
      # overlay fetches one verified GGUF file itself - see base/inferenceservice.yaml.
      args:
        - --alias
        - fallback-small
    # Overrides live under `model:`, not in a `containers:` entry. KServe
    # v0.20.0's webhook counts a container named kserve-container as a second
    # predictor implementation alongside `model:` and rejects the pair with
    # "exactly one of [...] must be specified in PredictorSpec". The reasoning,
    # the upstream source line, and the exact rejection text are recorded once
    # in overlays/local/patch-resources.yaml. `initContainers` and `volumes` are
    # not counted, so they stay where they are.
      resources:
        # A 0.5B Q4 model needs a fraction of the primary's footprint.
        requests: { cpu: "1", memory: 1Gi }
        limits: { cpu: "2", memory: 2Gi }
      volumeMounts:
        - { name: models, mountPath: /models }
    initContainers:
      - name: fetch-weights
        # Same pinned curl image as the primary's fetch-weights container;
        # see versions.yaml (images.curl) for how the digest was resolved.
        image: curlimages/curl:8.21.0@sha256:56bc0130aabaada5c04bb18d8d7f75e7a78fbcaa38ad44e1811c8c7720606d84
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            command -v sha256sum >/dev/null || { echo "sha256sum missing in init image" >&2; exit 1; }
            if [ -f /models/model.gguf ]; then
              echo "weights already present"; exit 0
            fi
            curl -fL --retry 3 --connect-timeout 20 \
              --speed-limit 10240 --speed-time 60 \
              -o /models/model.gguf \
              "https://huggingface.co/${HF_REPO}/resolve/main/${HF_FILE}"
            echo "${SHA256}  /models/model.gguf" | sha256sum -c -
        env:
          # Values come from models/ornith-9b/base/model.yaml, model.ci.
          - { name: HF_REPO, value: "Qwen/Qwen2.5-0.5B-Instruct-GGUF" }
          - { name: HF_FILE, value: "qwen2.5-0.5b-instruct-q4_k_m.gguf" }
          - { name: SHA256, value: "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db" }
        # Limits are required, not optional: policy/require-resource-limits.yaml
        # now inspects spec.initContainers as well as spec.containers (the
        # `=(initContainers)` block added 2026-08-19). Without these the
        # predictor pod is rejected at admission. Sized for what this
        # container actually does - one curl writing to an emptyDir - not for
        # the model it downloads.
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        volumeMounts:
          - { name: models, mountPath: /models }
    volumes:
      - name: models
        emptyDir: { sizeLimit: 2Gi }
