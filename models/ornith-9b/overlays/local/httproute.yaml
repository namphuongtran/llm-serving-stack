apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ornith-9b
  namespace: llm
spec:
  parentRefs: [{ name: llm, namespace: istio-system }]
  hostnames: ["llm.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        # The fallback-small InferenceService (fallback.yaml) is deployed but
        # not routed to from here: ADR 0007 withdraws the weight: 0 +
        # retries failover mechanism this rule used to carry. Weighted
        # cluster selection happens once, at initial route match; retries
        # stay inside the already-selected cluster and never reach a
        # zero-weight backend (Envoy issue 5891). Core Gateway API has no
        # failover primitive; a real one needs an Envoy aggregate cluster
        # via EnvoyFilter, which is out of scope for phase 1.
        - name: ornith-9b-predictor
          port: 80
      timeouts:
        # Streaming answers run for tens of seconds. The default is far too
        # short and truncates responses mid-sentence.
        request: 600s
        backendRequest: 600s
