# Named ornith-9b-openai, NOT ornith-9b, on purpose. With
# enableGatewayApi: true (platform/20-kserve/values-kserve.yaml), KServe's
# own ingress reconciler generates an HTTPRoute named after the
# InferenceService, in the InferenceService's namespace - literally
# llm/ornith-9b. A hand-written route under that same name would be the same
# object: KServe's controller and Argo CD (syncPolicy.automated.selfHeal:
# true on clusters/local-kind/apps/90-model-local.yaml) would overwrite each
# other on every reconcile, forever. The suffix keeps this route, which
# carries the streaming timeouts and is the Kuadrant policy target, separate
# from whatever KServe generates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ornith-9b-openai
  namespace: llm
spec:
  # group, kind, and weight below are written out even though they are the
  # Gateway API CRD's own defaults. The API server fills them in, so a manifest
  # that omits them can never match the live object, and Argo CD reported these
  # routes OutOfSync for the life of the cluster (observed 2026-08-20). Read
  # from the live HTTPRoute the same day: parentRefs gained
  # group=gateway.networking.k8s.io and kind=Gateway, and backendRefs gained
  # group="", kind=Service, and weight=1.
  parentRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: llm, namespace: istio-system }]
  hostnames: ["llm.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        # The fallback-small InferenceService (fallback.yaml) is deployed but
        # not routed to from here: ADR 0007 withdraws the weight: 0 +
        # retries failover mechanism this rule used to carry. Weighted
        # cluster selection happens once, at initial route match; retries
        # stay inside the already-selected cluster and never reach a
        # zero-weight backend (Envoy issue 5891). Core Gateway API has no
        # failover primitive; a real one needs an Envoy aggregate cluster
        # via EnvoyFilter, which is out of scope for phase 1.
        - group: ""
          kind: Service
          name: ornith-9b-predictor
          port: 80
          weight: 1
      timeouts:
        # Streaming answers run for tens of seconds. The default is far too
        # short and truncates responses mid-sentence.
        request: 600s
        backendRequest: 600s
