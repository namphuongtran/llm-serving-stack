apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ornith-9b
  namespace: llm
spec:
  predictor:
    minReplicas: 2
    # Streaming answers run for tens of seconds. The pod must finish them
    # before Kubernetes kills it, not just stop accepting new ones.
    terminationGracePeriodSeconds: 120
    # DoNotSchedule, not ScheduleAnyway. tests/smoke/08-availability.bats
    # asserts that the two replicas land on different nodes, and the two
    # tests after it (the PDB's currentHealthy/disruptionsAllowed, and the
    # node drain) only mean anything if that is true: with both replicas on
    # one node, draining that node takes the whole service out. ScheduleAnyway
    # treats the constraint as a preference the scheduler may ignore, so the
    # manifest and the test disagreed - and the honest way to settle that is
    # to make the constraint say what the test checks, not to weaken the test
    # into one that passes with both pods on one node.
    #
    # The cost is stated rather than hidden: if no second node can fit a
    # replica, the second pod stays Pending instead of quietly landing beside
    # the first. That is a visible failure with a readable reason, which is
    # the outcome this repository prefers over a silent loss of the property
    # the PDB and the drain runbook both assume.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            serving.kserve.io/inferenceservice: ornith-9b
    containers:
      - name: kserve-container
        lifecycle:
          preStop:
            exec:
              # Let the gateway notice the endpoint is going away before the
              # process stops accepting the stream it is already writing.
              command: ["/bin/sleep", "15"]
        volumeMounts:
          - { name: models, mountPath: /mnt/models }
    initContainers:
      - name: fetch-weights
        # Pinned by digest, not :latest. Resolved on 2026-08-19 with
        # `docker buildx imagetools inspect curlimages/curl:8.21.0`, this is the
        # linux/arm64/v8 manifest digest from that inspect output; recorded
        # with its date under images.curl in versions.yaml.
        image: curlimages/curl:8.21.0@sha256:56bc0130aabaada5c04bb18d8d7f75e7a78fbcaa38ad44e1811c8c7720606d84
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            command -v sha256sum >/dev/null || { echo "sha256sum missing in init image" >&2; exit 1; }
            if [ -f /mnt/models/model.gguf ]; then
              echo "weights already present"; exit 0
            fi
            curl -fL --retry 3 -o /mnt/models/model.gguf \
              "https://huggingface.co/${HF_REPO}/resolve/main/${HF_FILE}"
            echo "${SHA256}  /mnt/models/model.gguf" | sha256sum -c -
        env:
          # Values come from models/ornith-9b/base/model.yaml. They are written
          # in directly, not templated: a sed step nobody runs would otherwise
          # leave a placeholder in the committed file.
          - { name: HF_REPO, value: "ornith-ai/Ornith-1.0-9B-GGUF" }
          - { name: HF_FILE, value: "ornith-1.0-9b-Q4_K_M.gguf" }
          - { name: SHA256, value: "5720d1f671b4996481274fffe01868c3c36e87c135cc8538471cc7bd6087b106" }
        # Limits are required, not optional: policy/require-resource-limits.yaml
        # now inspects spec.initContainers as well as spec.containers (the
        # `=(initContainers)` block added 2026-08-19). Without these the
        # predictor pod is rejected at admission. Sized for what this
        # container actually does - one curl writing to an emptyDir - not for
        # the model it downloads.
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        volumeMounts:
          - { name: models, mountPath: /mnt/models }
    volumes:
      - name: models
        emptyDir: { sizeLimit: 12Gi }
