apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ornith-9b
  namespace: llm
spec:
  predictor:
    minReplicas: 2
    # Streaming answers run for tens of seconds. The pod must finish them
    # before Kubernetes kills it, not just stop accepting new ones.
    terminationGracePeriodSeconds: 120
    # DoNotSchedule, not ScheduleAnyway. tests/smoke/08-availability.bats
    # asserts that the two replicas land on different nodes, and the two
    # tests after it (the PDB's currentHealthy/disruptionsAllowed, and the
    # node drain) only mean anything if that is true: with both replicas on
    # one node, draining that node takes the whole service out. ScheduleAnyway
    # treats the constraint as a preference the scheduler may ignore, so the
    # manifest and the test disagreed - and the honest way to settle that is
    # to make the constraint say what the test checks, not to weaken the test
    # into one that passes with both pods on one node.
    #
    # The cost is stated rather than hidden: if no second node can fit a
    # replica, the second pod stays Pending instead of quietly landing beside
    # the first. That is a visible failure with a readable reason, which is
    # the outcome this repository prefers over a silent loss of the property
    # the PDB and the drain runbook both assume.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            serving.kserve.io/inferenceservice: ornith-9b
    # Overrides go under `model:`, NOT in a `containers:` entry named
    # kserve-container. This is not a style preference, it is what KServe
    # v0.20.0's admission webhook requires.
    #
    # Found on 2026-08-19, on the first real run of this overlay against a live
    # cluster. `kustomize build ... | kubectl apply -f -` was rejected with:
    #   admission webhook "inferenceservice.kserve-webhook-server.validator"
    #   denied the request: exactly one of [Name, SKLearn, XGBoost, Tensorflow,
    #   PyTorch, Triton, ONNX, HuggingFace, PMML, LightGBM, Paddle, Model,
    #   StorageUris, StorageContainerName, WorkerSpec, PodSpec] must be
    #   specified in PredictorSpec
    #
    # The reason is in pkg/apis/serving/v1beta1/predictor.go at tag v0.20.0.
    # GetImplementations() collects the non-nil framework specs (which includes
    # s.Model), and THEN:
    #   if len(s.Containers) != 0 {
    #     for _, container := range s.Containers {
    #       if container.Name == constants.InferenceServiceContainerName {
    #         implementations = append(implementations, NewCustomPredictor(&s.PodSpec))
    # So `model:` plus a container named kserve-container is TWO
    # implementations, and the webhook demands exactly one. Note that only
    # `Containers` is counted this way: `initContainers` and `volumes` below are
    # not, which is why they stay at the predictor level.
    #
    # `model:` is the right home because PredictorExtensionSpec inlines
    # corev1.Container, with the upstream comment "Container enables overrides
    # for the predictor. Each framework will have different defaults that are
    # populated in the underlying container spec." So lifecycle and volumeMounts
    # are exactly what that field is for.
    #
    # Every overlay in this directory that renders an InferenceService had the
    # same defect, and every one was rejected. `kustomize build` rendered all of
    # them without complaint, and `task lint` passed, because rendering is not
    # admission - which is this repository's own stated rule.
    #
    # > **RESOLVED (2026-08-19), and it took three fixes, not one. Recorded in
    # > order because each one was only visible after the previous one landed.**
    # >
    # > FIRST: moving the override here was necessary but not sufficient. With it
    # > moved, admission passed and the Deployment was created, then pod creation
    # > failed:
    # >   spec.containers[0].volumeMounts[2].mountPath: Invalid value:
    # >   "/mnt/models": must be unique
    # > The chain, all read at tag v0.20.0:
    # >   1. utils/utils.go:58 IsMMSPredictor returns, when predictor.Containers
    # >      is EMPTY, `!hasStorageUri && !hasStorageSpec && !hasStorageUris`.
    # >      This overlay sets none of the three, deliberately, so multi-model
    # >      serving is inferred. The cluster confirmed that reading by creating
    # >      ConfigMaps modelconfig-ornith-9b-0 and modelconfig-fallback-small-0.
    # >   2. components/component.go:92 addAgentAnnotations then sets
    # >      internal.serving.kserve.io/agent=true and modelDir=/mnt/models.
    # >   3. webhook/admission/pod/agent_injector.go:514 mountModelDir mounts a
    # >      volume named "model-dir" (constants.go:528) at constants.ModelDir
    # >      (= /mnt/models) onto kserve-container, via mountVolumeToContainer,
    # >      which APPENDS with no duplicate check (same file, line 557).
    # >   4. The ServingRuntime already mounted our "models" volume there.
    # > The two failure modes are mutually exclusive, which is why this was a
    # > design decision and not a typo:
    # >   with `containers:`     -> webhook rejects, "exactly one implementation"
    # >   without `containers:`  -> agent appends a duplicate mount
    # > Adding a storageUri to escape MMS does not help on its own either: the
    # > storage-initializer then injects its own /mnt/models mount.
    # >
    # > FIX 1, chosen from the three options in docs/deployment-walkthrough.md:
    # > move OUR volume off /mnt/models entirely. It is now /models here, in
    # > fallback.yaml, in the ci overlay, and in the ServingRuntime's --model
    # > argument. KServe's agent keeps /mnt/models to itself and nothing
    # > collides. Accepted cost: the agent sidecar is injected and does nothing,
    # > requesting 100Mi.
    # >
    # > SECOND, revealed by fix 1: the pod was then rejected by THIS
    # > repository's own policy.
    # >   admission webhook "validate.kyverno.svc-fail" denied the request:
    # >   disallow-floating-tags: require-digest-or-fixed-tag: ... failed at path
    # >   /spec/containers/1/image/
    # > containers[1] is that injected agent, and the chart renders its image
    # > with an empty tag, giving the floating `kserve/agent:v0.20.0`. The policy
    # > worked exactly as designed. FIX 2 pins it by digest in both copies of the
    # > KServe values; see versions.yaml images.kserve_agent.
    # >
    # > THIRD, revealed by fix 2: every authenticated request returned 401 with a
    # > valid token, because
    # > Authorino could not fetch the issuer's discovery document. Its own log:
    # >   issuerUrl "http://llm.localtest.me/realms/llm"
    # >   error: dial tcp [::1]:80: connect: connection refused
    # >   -> UNAUTHENTICATED, "missing openid connect configuration"
    # > llm.localtest.me is a public name resolving to 127.0.0.1, so inside the
    # > pod it means the pod. FIX 3 is a CoreDNS rewrite, and it now lives in
    # > platform/10-istio/coredns-rewrite.yaml:
    # >   rewrite name llm.localtest.me llm-istio.istio-system.svc.cluster.local
    # > After it, discovery returned 200 from inside the cluster and the issuer
    # > string matched the token's `iss` exactly. Proved by mutation the same day:
    # > reverting kind's Corefile brought the 401 straight back, and reapplying
    # > that one manifest restored HTTP 200 after about 80 seconds with no
    # > restart. tests/smoke/03-identity.bats now guards it from the pod side,
    # > which is the only side that can see this failure.
    # >
    # > END STATE, observed 2026-08-19 15:26 UTC: no token -> 401; valid JWT ->
    # > 200; a streaming chat completion returned 43 SSE data chunks; both
    # > InferenceServices report Ready=True.
    model:
      lifecycle:
        preStop:
          exec:
            # Let the gateway notice the endpoint is going away before the
            # process stops accepting the stream it is already writing.
            command: ["/bin/sleep", "15"]
      volumeMounts:
        - { name: models, mountPath: /models }
    initContainers:
      - name: fetch-weights
        # Pinned by digest, not :latest. Resolved on 2026-08-19 with
        # `docker buildx imagetools inspect curlimages/curl:8.21.0`, this is the
        # linux/arm64/v8 manifest digest from that inspect output; recorded
        # with its date under images.curl in versions.yaml.
        image: curlimages/curl:8.21.0@sha256:56bc0130aabaada5c04bb18d8d7f75e7a78fbcaa38ad44e1811c8c7720606d84
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            command -v sha256sum >/dev/null || { echo "sha256sum missing in init image" >&2; exit 1; }
            if [ -f /models/model.gguf ]; then
              echo "weights already present"; exit 0
            fi
            curl -fL --retry 3 -o /models/model.gguf \
              "https://huggingface.co/${HF_REPO}/resolve/main/${HF_FILE}"
            echo "${SHA256}  /models/model.gguf" | sha256sum -c -
        env:
          # Values come from models/ornith-9b/base/model.yaml. They are written
          # in directly, not templated: a sed step nobody runs would otherwise
          # leave a placeholder in the committed file.
          - { name: HF_REPO, value: "ornith-ai/Ornith-1.0-9B-GGUF" }
          - { name: HF_FILE, value: "ornith-1.0-9b-Q4_K_M.gguf" }
          - { name: SHA256, value: "5720d1f671b4996481274fffe01868c3c36e87c135cc8538471cc7bd6087b106" }
        # Limits are required, not optional: policy/require-resource-limits.yaml
        # now inspects spec.initContainers as well as spec.containers (the
        # `=(initContainers)` block added 2026-08-19). Without these the
        # predictor pod is rejected at admission. Sized for what this
        # container actually does - one curl writing to an emptyDir - not for
        # the model it downloads.
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        volumeMounts:
          - { name: models, mountPath: /models }
    volumes:
      - name: models
        emptyDir: { sizeLimit: 12Gi }
