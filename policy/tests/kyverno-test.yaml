# Verified against the real kyverno CLI (v1.18.2, installed locally,
# 2026-08-19): `kyverno create test` scaffolds an older, untyped format this
# CLI's own `test` command rejects ("unknown field"). This is the schema
# `kyverno test policy/tests` actually accepts, confirmed by running it
# against this exact file - see the "resources" field under each result:
# a list of "namespace/name" strings, not the singular "resource"/"namespace"
# pair the scaffolder produces.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policy-tests
policies:
  - ../require-resource-limits.yaml
  - ../disallow-floating-tags.yaml
  - ../require-labels.yaml
resources:
  - resources.yaml
results:
  - policy: require-resource-limits
    rule: check-limits
    kind: Pod
    resources: ["llm/good-pod"]
    result: pass
  - policy: disallow-floating-tags
    rule: require-digest-or-fixed-tag
    kind: Pod
    resources: ["llm/good-pod"]
    result: pass
  - policy: require-labels
    rule: require-part-of
    kind: Deployment
    resources: ["llm/good-deployment"]
    result: pass
  - policy: require-resource-limits
    rule: check-limits
    kind: Pod
    resources: ["llm/nolimits-pod"]
    result: fail
  - policy: disallow-floating-tags
    rule: require-digest-or-fixed-tag
    kind: Pod
    resources: ["llm/floating-pod"]
    result: fail
  # A tag in front of the digest must still pass. This is the form every real
  # image reference in this repository took on 2026-08-19; see the comment on
  # tagged-digest-pod in resources.yaml for why the case exists.
  - policy: disallow-floating-tags
    rule: require-digest-or-fixed-tag
    kind: Pod
    resources: ["llm/tagged-digest-pod"]
    result: pass
  - policy: require-labels
    rule: require-part-of
    kind: Deployment
    resources: ["llm/bad-deployment"]
    result: fail
  # Init-container coverage, added 2026-08-19 alongside the
  # `=(initContainers)` blocks in both policies. good-init-pod proves a
  # compliant init container passes; the other two prove a non-compliant one
  # fails, with the main container left compliant so only the init container
  # can be the cause. good-pod above (no initContainers key at all) still
  # passing is what proves the equality anchor keeps the key optional.
  - policy: require-resource-limits
    rule: check-limits
    kind: Pod
    resources: ["llm/good-init-pod"]
    result: pass
  - policy: disallow-floating-tags
    rule: require-digest-or-fixed-tag
    kind: Pod
    resources: ["llm/good-init-pod"]
    result: pass
  - policy: require-resource-limits
    rule: check-limits
    kind: Pod
    resources: ["llm/nolimits-init-pod"]
    result: fail
  - policy: disallow-floating-tags
    rule: require-digest-or-fixed-tag
    kind: Pod
    resources: ["llm/floating-init-pod"]
    result: fail
