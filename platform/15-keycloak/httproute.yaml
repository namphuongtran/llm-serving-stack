apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: llm
spec:
  # Defaults written out so git can match the live object; see the note in
  # models/ornith-9b/overlays/local/httproute.yaml.
  parentRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: llm, namespace: istio-system }]
  hostnames: ["llm.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /realms }
        - path: { type: PathPrefix, value: /resources }
      backendRefs: [{ group: "", kind: Service, name: keycloak, port: 8080, weight: 1 }]
