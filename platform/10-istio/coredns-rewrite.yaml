# In-cluster DNS for the external hostname, so the OIDC issuer resolves from
# inside a pod.
#
# WHY THIS EXISTS. Without it, not one authenticated request succeeds. The
# AuthPolicy in security/oidc/authpolicy.yaml names
# `issuerUrl: http://llm.localtest.me/realms/llm`, and Authorino must fetch that
# issuer's discovery document ITSELF before it can verify any token.
# `llm.localtest.me` is a public name that resolves to 127.0.0.1, so inside the
# Authorino pod it means the pod. Authorino's own log, on a live cluster on
# 2026-08-19:
#
#   level=error logger=authorino.service.auth.authpipeline.identity.jwt
#   msg="failed to discovery openid connect configuration"
#   issuerUrl="http://llm.localtest.me/realms/llm"
#   error="Get \"http://llm.localtest.me/realms/llm/.well-known/openid-configuration\":
#          dial tcp [::1]:80: connect: connection refused"
#   -> authorized=false response=UNAUTHENTICATED
#      message="missing openid connect configuration"
#
# Every request returned 401 with a valid, correctly-issued JWT. The token's
# `iss` and the AuthPolicy's `issuerUrl` matched exactly; only DNS did not.
#
# WHY A REWRITE, NOT A HOSTS ENTRY. `rewrite name` retargets the query at the
# gateway's Service NAME, so it keeps working when that Service is deleted and
# recreated with a different ClusterIP. A `hosts` block would pin an IP that
# goes stale.
#
# WHY THE GATEWAY AND NOT KEYCLOAK DIRECTLY. Keycloak is reached through the
# same Gateway as everything else: platform/10-istio/install.sh applies an
# HTTPRoute for host `llm.localtest.me` on paths /realms and /resources. So
# pointing the name at the gateway gives Authorino the identical path an external
# client takes, and one issuer string stays valid on both sides. Verified from
# inside the cluster on 2026-08-19: the discovery document returned HTTP 200 and
# reported `"issuer":"http://llm.localtest.me/realms/llm"`.
#
# THE ALTERNATIVE, considered and not taken: set `KC_HOSTNAME` to an in-cluster
# URL so the token's `iss` is a name Authorino can already resolve. That needs no
# DNS change at all, but it makes the discovery document advertise endpoints no
# external client can reach. This repository only uses client_credentials today,
# so it would work; it was rejected because a single issuer string valid on both
# sides is the honest analogue of the split-horizon DNS a real deployment has.
#
# ---------------------------------------------------------------------------
# THE COST OF THIS FILE, STATED PLAINLY.
#
# CoreDNS has no `import` directive in kind's Corefile, and `rewrite` must sit
# inside the `.:53` server block. There is no way to add one line without
# owning the whole file. So this ConfigMap REPLACES the Corefile that
# `kindest/node` ships. Apart from ONE added directive and the comment block
# above it, everything below is kind's default copied verbatim.
#
# Do not trust a line count here, including this one: an earlier version said
# "the two rewrite lines", which is a number a reader would have diffed against
# and not found, and the comment block has since grown. Diff it instead:
#   strip() { grep -vE '^[[:space:]]*#|rewrite name llm' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}'; }
#   diff <(yq -r '.data.Corefile' platform/10-istio/coredns-rewrite.yaml | strip) \
#        <(kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}' | strip)
#
# The `sed` drops trailing blank lines. Without it the diff reports one spurious
# line, because `yq` emits a trailing newline the ConfigMap's stored value does
# not have. Ran this form on 2026-08-20 against a cluster built from the pinned
# digest: no output, so no drift.
#
# That is only safe because the node image is pinned by digest:
# versions.yaml `kubernetes.kind_node` is
# kindest/node:v1.36.1@sha256:3489c767... . The Corefile below was read out of a
# running cluster built from exactly that digest, on 2026-08-19, with
#   kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}'
#
# **Bumping kind_node means re-reading this file.** A newer node image may ship a
# different Corefile, and this manifest would silently revert whatever changed.
#
# The guard is tests/smoke/03-identity.bats, whose last two tests query from
# INSIDE a pod: one asserts the name resolves to the gateway's ClusterIP, the
# other fetches the OIDC discovery document. A drift that breaks in-cluster
# resolution fails both, loudly.
#
# This comment named tests/smoke/02-gateway.bats until 2026-08-20. That was the
# citation that resolves and does not hold: 02-gateway.bats reaches
# llm.localtest.me only from the HOST, where the host resolver answers, so it
# cannot see in-cluster DNS drift at all. Naming it here would have bounded the
# risk of owning this Corefile with a guard structurally incapable of catching it.
#
# Neither suite catches a drift that merely loses an unrelated kind improvement.
# Verified 2026-08-20 that the Corefile below still matches the live one on a
# cluster built from the pinned digest, byte for byte apart from the four added
# lines: `kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}'`
# diffed against `yq -r '.data.Corefile'` on this file, both with comments and the
# rewrite stripped, reports no difference. Re-read it deliberately on a bump.
#
# No restart is needed. kind's Corefile ends with `reload`, so CoreDNS rereads the
# ConfigMap on its own. How long that takes is NOT "about 30 seconds", which is
# what this said until 2026-08-20: the reload plugin adds jitter to its check
# interval by design (its own README: "jitter is added to the reload check
# interval"), and the kubelet's delay in projecting a changed ConfigMap into the
# pod comes on top and is unaccounted for. The one number actually measured is
# end to end: 401 back to 200 in about 80 seconds. Treat that as the observation
# and the decomposition as unknown. That is why this file is a
# plain manifest and not a Job: it works identically on the imperative path and
# under Argo CD, with no ServiceAccount, no RBAC, and no extra pinned image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  # kube-system, not istio-system. This is the one object in this directory that
  # lives outside the layer's own namespace, because CoreDNS belongs to the
  # cluster. Argo CD applies it from the same directory source; the explicit
  # namespace here wins over the Application's destination.
  namespace: kube-system
  annotations:
    # Prune=false, and this one is not optional.
    #
    # clusters/local-kind/apps/10-istio-gateway.yaml sources this directory with
    # `automated: {prune: true, selfHeal: true}`. Without this annotation,
    # deleting or renaming this file would make Argo CD DELETE the coredns
    # ConfigMap rather than restore kind's default - taking out all cluster DNS,
    # not just the rewrite, and leaving recovery to whoever still has the
    # verbatim Corefile. This object is adopted from the cluster, not created by
    # this repository, so pruning it is never the right action.
    #
    # selfHeal still applies, which is wanted: Argo CD will put the rewrite back
    # if something else overwrites the Corefile.
    argocd.argoproj.io/sync-options: Prune=false
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        # THE ONLY ADDED DIRECTIVE. Everything else in this block is verbatim.
        #
        # Its POSITION in the file is cosmetic. An earlier version of this comment
        # said it was "placed before `kubernetes` so the rewritten name is then
        # answered by the cluster zone", which is not how CoreDNS works: plugin
        # execution order is fixed at compile time by plugin.cfg, not by Corefile
        # line order. That file's own header says "Directives are registered in
        # the order they should be executed. Ordering is VERY important", and it
        # lists `rewrite:rewrite` at line 53 and `kubernetes:kubernetes` at line
        # 69 (read 2026-08-20). So rewrite runs first wherever this line sits.
        # The result is right; the stated reason was wrong.
        rewrite name llm.localtest.me llm-istio.istio-system.svc.cluster.local
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
