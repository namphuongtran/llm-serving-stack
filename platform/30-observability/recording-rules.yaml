# Normalises engine-specific series into an `llmstack:` namespace so one
# dashboard (platform/30-observability/dashboards/llm-serving.json) reads the
# same names regardless of which engine is behind the predictor. Adding vLLM
# in phase 2 means adding a second expression per rule here; it changes no
# dashboard.
#
# The left-hand `llamacpp:*` names are read from llama.cpp's own server
# README at the exact git commit the pinned image (versions.yaml:
# images.llamacpp_server) was built from -
# 25ae3a9b331fffea50ff8d07a5cad34c33f1276f - fetched 2026-08-19 from:
#   https://raw.githubusercontent.com/ggml-org/llama.cpp/25ae3a9b331fffea50ff8d07a5cad34c33f1276f/tools/server/README.md
# This is documentation-derived, not read from a live /metrics endpoint: no
# cluster exists in phase 1 authoring to run the confirming command against
# (see docs/adr/0006-metric-normalisation.md, which records the full metric
# list and this same command to run once a cluster exists). A rule whose
# left-hand series does not exist produces silence, not an error, which is
# the worst failure mode in observability - so every name below is quoted
# from that README, none invented.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llmstack-normalisation
  namespace: observability
  labels: { release: kube-prometheus-stack }
spec:
  groups:
    - name: llmstack.normalisation
      interval: 15s
      rules:
        # llamacpp:requests_processing - "Number of requests processing." (Gauge)
        - record: llmstack:requests_running
          expr: sum(llamacpp:requests_processing) or vector(0)
        # llamacpp:requests_deferred - "Number of requests deferred." (Gauge)
        - record: llmstack:requests_waiting
          expr: sum(llamacpp:requests_deferred) or vector(0)
        # The line above is the cluster total, which is what the dashboard
        # graphs. An autoscaler needs one model's queue, not every model's.
        - record: llmstack:requests_waiting:by_model
          expr: sum by (serving_kserve_io_inferenceservice) (llamacpp:requests_deferred)
        # llamacpp:tokens_predicted_total - "Number of generation tokens
        # processed." (Counter)
        - record: llmstack:tokens_out_total
          expr: sum(llamacpp:tokens_predicted_total) or vector(0)
        # llamacpp:prompt_tokens_total - "Number of prompt tokens processed."
        # (Counter). The input side of the pair above. Prefill and decode are
        # different work with different costs, and one number for "tokens"
        # hides which of the two is slow.
        - record: llmstack:tokens_in_total
          expr: sum(llamacpp:prompt_tokens_total) or vector(0)

        # Added 2026-08-19. The three rules above were the whole of this file's
        # engine coverage, which left four series this engine already exposes
        # unused - including the one below, the only per-token latency signal
        # llama.cpp reports at all.
        #
        # llamacpp:tokens_predicted_seconds_total - "Predict process time in
        # seconds." (Counter), over llamacpp:tokens_predicted_total above.
        # Both names come from the same pinned README as every other left-hand
        # series here.
        #
        # This is the other half of what a user feels. TTFT below says when the
        # answer starts. This says how fast it is written afterwards, and
        # unlike TTFT the engine reports it, so this needs no prober.
        #
        # rate() on both sides rather than a bare ratio of counters, so the
        # value means "seconds per token over the last 5 minutes" and not
        # "averaged since the pod started". sum() wraps each rate separately
        # because a mean of per-replica means is not the mean across replicas.
        #
        # Deliberately no `or vector(0)`, for exactly the reason the TTFT rules
        # below have none: an absent value means no tokens were generated in
        # the window, and 0 seconds per token would read as infinitely fast.
        - record: llmstack:seconds_per_output_token
          expr: sum(rate(llamacpp:tokens_predicted_seconds_total[5m])) / sum(rate(llamacpp:tokens_predicted_total[5m]))

        # llamacpp:n_busy_slots_per_decode - "Average number of busy slots per
        # llama_decode() call." (Gauge)
        #
        # Batching efficiency, and the signal that explains the other two.
        # Every decode step costs roughly the same whether one slot is busy or
        # all of them, so a low number under load means capacity is being
        # thrown away, and a number at the slot limit means the engine is
        # genuinely full. Neither requests_running nor throughput shows this on
        # its own.
        #
        # avg(), not sum(): the engine already reports an average per decode
        # call, so summing across replicas would produce a number with no
        # meaning. No `or vector(0)` - an idle engine and an unscraped one must
        # not look the same.
        - record: llmstack:batch_occupancy
          expr: avg(llamacpp:n_busy_slots_per_decode)

        # llamacpp:n_tokens_max - "High watermark of the context size
        # observed." (Counter)
        #
        # The closest thing this engine has to a memory-pressure signal. ADR
        # 0006 records that llama.cpp reports no KV-cache series at all, so
        # this watermark is what there is: it says how close real traffic has
        # come to the context limit the runtime was started with.
        #
        # max(), not sum(): a watermark across replicas is the highest one, not
        # their total.
        - record: llmstack:context_tokens_max
          expr: max(llamacpp:n_tokens_max)

        # Time-to-first-token has no engine-reported source in phase 1.
        # llama.cpp's /metrics exposes only the counters and gauges named
        # above (plus prompt/decode/speculative-decoding counters not needed
        # here) - no latency histogram of any kind, so there is nothing a
        # `histogram_quantile` could read. See ADR 0006's "panels this engine
        # cannot fill" table.
        #
        # llm_ttft_probe_seconds is not an engine metric. It is the gauge
        # platform/30-observability/ttft-prober-cronjob.yaml pushes to
        # Pushgateway once a minute, measured client-side with curl's
        # time_starttransfer against the same gateway path a real client
        # uses. quantile_over_time turns the resulting series of single
        # samples into a rolling percentile the way a histogram would.
        # Deliberately no `or vector(0)`: an absent sample here means "no
        # prober run has landed yet in this window", and reporting 0 seconds
        # instead would misrepresent a synthetic gap as a real, fast answer.
        - record: llmstack:ttft_seconds:p50
          expr: quantile_over_time(0.5, llm_ttft_probe_seconds[15m])
        - record: llmstack:ttft_seconds:p95
          expr: quantile_over_time(0.95, llm_ttft_probe_seconds[15m])

    # Gateway-side signals, added 2026-08-19. Nothing in this group comes
    # from the engine, and that is the point: llama.cpp reports no HTTP status
    # code and no request latency of any kind (ADR 0006 lists its complete
    # metric set), so error rate and edge latency cannot come from it. They
    # come from the Envoy in front of it, which already produces them.
    #
    # Before this group existed the data was produced and thrown away.
    # podmonitor.yaml scraped only predictor pods in namespace llm, and the
    # gateway lives in istio-system, so nothing collected it. A second
    # PodMonitor in that file now does.
    #
    # Metric and label names read from Istio's own reference documentation on
    # 2026-08-19, https://istio.io/latest/docs/reference/config/metrics/ :
    # istio_requests_total is a COUNTER, istio_request_duration_milliseconds is
    # a DISTRIBUTION measured in MILLISECONDS (hence the division below), and
    # response_code is documented as applying to HTTP metrics.
    #
    # Documentation-derived, not read from a live endpoint, exactly like the
    # llamacpp:* names above. A recording rule over a series that does not
    # exist is silent rather than an error, so
    # tests/smoke/05-observability.bats carries a test whose only job is to
    # fail loudly if the gateway target is not actually being scraped.
    #
    # No `reporter=` filter and no workload filter. The gateway is the only
    # thing this repository scrapes that emits istio_requests_total at all, so
    # a filter here could only narrow a correct result to an empty one.
    - name: llmstack.gateway
      interval: 15s
      rules:
        # Request rate by status, which is what turns "something is wrong" into
        # "401s are up" or "the engine is returning 500s".
        - record: llmstack:gateway_requests:rate5m
          expr: sum by (response_code) (rate(istio_requests_total[5m]))

        # Error ratio, written so that the series exists exactly when the
        # answer is known. If traffic is flowing the denominator exists, so a
        # healthy service reports a real 0. If nothing is scraped, or no
        # traffic has arrived, the denominator is absent and so is the ratio.
        # A bare `or vector(0)` on the numerator alone would report a confident
        # zero for an unscraped gateway, which is the failure this file's other
        # comments keep warning about.
        - record: llmstack:gateway_error_ratio:rate5m
          expr: (sum(rate(istio_requests_total{response_code=~"5.."}[5m])) or vector(0)) / sum(rate(istio_requests_total[5m]))

        # Edge latency. This is whole-request duration, so for a streamed
        # answer it measures until the LAST token, not the first. TTFT is the
        # separate number above, and the two must not be confused: a long p95
        # here is normal for long generations and says nothing about
        # responsiveness on its own.
        #
        # Divided by 1000 because Istio's histogram is in milliseconds and
        # every other duration in this file is in seconds.
        - record: llmstack:gateway_request_seconds:p95
          expr: histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket[5m]))) / 1000

    # Pushgateway serves the last value it was ever given, forever - a dead
    # ttft-prober CronJob does not clear llm_ttft_probe_seconds, it freezes
    # it, and Prometheus keeps re-scraping that frozen number looking exactly
    # like a healthy measurement. This group closes that gap the way
    # Pushgateway's own README recommends ("Alerting on failed pushes"):
    # push_time_seconds is a meta-metric Pushgateway itself adds per pushed
    # group, holding the Unix timestamp of the last successful push, so
    # `time() - push_time_seconds` is exactly "how long since the prober last
    # actually ran", independent of whatever value it last pushed.
    # values-prometheus.yaml sets alertmanager.enabled: false (phase 1 has no
    # notification routing target), so this alert has nowhere to page. It
    # still fires and is visible directly: Prometheus evaluates it and
    # exposes it as its own ALERTS/ALERTS_FOR_STATE series and on its
    # /api/v1/alerts endpoint regardless of whether Alertmanager is running,
    # and the dashboard panel below queries push_time_seconds directly
    # rather than depending on this alert's firing state.
    - name: llmstack.alerts
      interval: 30s
      rules:
        # Three alerts added 2026-08-20. Until then the only alert in this
        # repository watched the prober, so the one failure mode it had actually
        # measured, R7, raised nothing. R18 in docs/sad/11-risks-and-debt.md.
        #
        # **Untried (2026-08-20):** none of the three has ever fired, and
        # values-prometheus.yaml sets `alertmanager: enabled: false`, so a firing
        # alert appears in Prometheus and its `ALERTS` series and is routed
        # nowhere. Enabling Alertmanager is a separate decision with a memory
        # cost (R4). Settle these by re-running the 2026-08-20 load test and
        # reading `ALERTS{alertstate="firing"}`.
        - alert: LLMGatewayErrorRatioHigh
          expr: llmstack:gateway_error_ratio:rate5m > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "More than 5% of gateway requests are 5xx"
            description: "This is the shape of R7: Authorino returns gRPC 14 UNAVAILABLE when it cannot reach the issuer, and the gateway renders that as HTTP 500 on both the accept and the reject path. Check the Authorino logs for 'failed to discovery openid connect configuration' before blaming the engine."
        - alert: LLMQueueAboveScaleThreshold
          expr: llmstack:requests_waiting > 2
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Requests have been queued above the KEDA threshold for 10 minutes"
            description: "The ScaledObject threshold is 2. A queue that stays above it for ten minutes means scaling is not relieving it: either the replica ceiling is reached, or a new replica cannot schedule, or it is still downloading weights."
        - alert: LLMPredictorReplicasNotReady
          expr: kube_deployment_spec_replicas{namespace="llm"} - kube_deployment_status_replicas_ready{namespace="llm"} > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "A predictor Deployment has wanted more replicas than it has for 15 minutes"
            description: "This is R8: maxReplicaCount 3 and maxSkew 1 cannot both hold on two worker nodes, so KEDA writes spec.replicas 3 and the third pod stays Pending. tests/smoke/07-autoscaling.bats asserts on spec.replicas and passes anyway, which is why this alert exists. Read `kubectl -n llm describe pod` for the scheduling message."
        - alert: TTFTProberStale
          # The prober runs once a minute; 300s tolerates a handful of missed
          # runs before paging, and `for: 2m` keeps a single borderline scrape
          # from flapping the alert.
          expr: time() - push_time_seconds{job="ttft-prober"} > 300
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "TTFT prober has not pushed in over 5 minutes"
            description: "llmstack:ttft_seconds:p50/p95 are frozen at whatever llm_ttft_probe_seconds last held, not a live measurement. Check the ttft-prober CronJob in the observability namespace."
