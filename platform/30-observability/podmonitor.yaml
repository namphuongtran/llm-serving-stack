# The scrape targets for this layer, and the only copy of them. Task 12
# (GitOps) needed a real file, because an Argo CD Application can source a git
# path and not a shell script's heredoc.
#
# Both paths now read this one file. install.sh used to hold its own heredoc
# copy of the first PodMonitor below; on 2026-08-19 it was changed to
# `kubectl apply -f platform/30-observability/podmonitor.yaml` instead, so
# there is nothing left to keep in step by hand.
#
# Scrapes the predictor directly: KServe pods expose the engine port, not a
# separate metrics port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: llm-predictors
  namespace: observability
spec:
  namespaceSelector: { matchNames: [llm] }
  selector:
    matchExpressions: [{ key: serving.kserve.io/inferenceservice, operator: Exists }]
  podMetricsEndpoints: [{ port: http, path: /metrics, interval: 15s }]
---
# Added 2026-08-19. The PodMonitor above scrapes only predictor pods in
# namespace llm, so until now nothing collected the gateway's own metrics -
# istio_requests_total and istio_request_duration_milliseconds were produced on
# every request and discarded. They are the only source in this stack for HTTP
# status codes and request latency, because llama.cpp reports neither (ADR
# 0006 lists its complete metric set).
#
# `portNumber: 15020`, not `port: <name>` and not `targetPort`. Three reasons,
# all read out of the PodMonitor CRD shipped with kube-prometheus-stack 88.5.0
# on 2026-08-19:
#   - `port` matches a container port by NAME, and its own description says
#     "If the pod doesn't expose a port with the same name, it will result in
#     no targets being discovered". A silently empty scrape is the failure this
#     layer's recording-rules.yaml keeps warning about, and the port name on an
#     istiod-generated gateway pod is not something this repository can check
#     without a cluster.
#   - `targetPort` is marked "Deprecated: use 'port' or 'portNumber' instead"
#     in that same CRD.
#   - `portNumber` takes an integer, so it does not depend on a name at all.
#
# 15020 with path /stats/prometheus is the merged endpoint Istio serves when
# meshConfig has enablePrometheusMerge: true. That setting is on: rendering
# istiod 1.30.3 with this repository's own install arguments on 2026-08-19
# produced a mesh ConfigMap containing `enablePrometheusMerge: true`.
#
# SETTLED 2026-08-19 on a live kind cluster. This block carried an `Untried`
# marker asking two questions. Both now have answers, and they differ:
#
#   1. Does the pod declare container port 15020?  YES.
#      kubectl -n istio-system get pod -l gateway.networking.k8s.io/gateway-name=llm \
#        -o jsonpath='{range .items[0].spec.containers[*]}{.name}{": "}{range .ports[*]}{.name}{"/"}{.containerPort}{" "}{end}{end}'
#      printed `istio-proxy: metrics/15020 status-port/15021 http-envoy-prom/15090`.
#      So the CRD's requirement is met - it says `portNumber` "cannot be used to
#      enable scraping of an undeclared port", and 15020 is declared.
#
#   2. Does the pod carry the label this file selected?  NO, and that was a
#      real defect. The selector below read `istio.io/gateway-name`, a key
#      Istio removed in 1.24. On the same cluster:
#        -l istio.io/gateway-name=llm                    -> 0 pods
#        -l gateway.networking.k8s.io/gateway-name=llm    -> 1 pod
#      Nothing carried the old key at all, so this PodMonitor discovered no
#      target and every llmstack:gateway_* rule would have gone silent. The
#      selector is corrected below, and the same correction was applied to
#      platform/10-istio/telemetry.yaml, which had the same key.
#
# The confirming command in the old marker used the dead label too, so running
# it would have reported a false negative about the port. That is why it is
# rewritten above rather than kept.
#
# > **Untried (2026-08-19):** that this scrape returns data, as opposed to
# > merely finding a target. The port is declared and the selector now matches,
# > but no Prometheus has scraped it here yet. Settle it with
# > `tests/smoke/05-observability.bats`, whose "prometheus is scraping the
# > gateway" test fails when the target set is empty.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-gateway
  namespace: observability
spec:
  namespaceSelector: { matchNames: [istio-system] }
  selector:
    # Selected by existence rather than by value, so a second Gateway added
    # later is scraped without editing this file. istiod sets this label on the
    # Deployment it generates for a Gateway API Gateway.
    matchExpressions: [{ key: gateway.networking.k8s.io/gateway-name, operator: Exists }]
  podMetricsEndpoints:
    - portNumber: 15020
      path: /stats/prometheus
      interval: 15s
---
# Tempo's own metrics, added 2026-08-19 with the gateway tracing change. Tempo
# is the one component here whose job cannot be checked by looking at it: a
# trace backend with no traces and a trace backend nobody is sending to look
# identical from the outside.
#
# tempo_distributor_spans_received_total is what tells them apart, and
# tests/smoke/05-observability.bats queries it. Without this PodMonitor that
# question can only be answered by exec-ing into a pod.
#
# Port 3200 is `server.http_listen_port` in tempo.yaml's config, and the same
# port the readiness probe uses for /ready. portNumber rather than a port name,
# for the reason spelled out on the istio-gateway PodMonitor above - except
# here the port IS declared, by tempo.yaml itself, as containerPort 3200 named
# http. So this one is not a guess about somebody else's pod spec.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tempo
  namespace: observability
spec:
  namespaceSelector: { matchNames: [observability] }
  selector:
    matchLabels: { app: tempo }
  podMetricsEndpoints:
    - portNumber: 3200
      path: /metrics
      interval: 15s
