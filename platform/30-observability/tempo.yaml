# Trace backend. Hand-written, not a Helm chart, and that is a decision rather
# than a shortcut.
#
# CORRECTED 2026-08-19, later the same day. The first version of this comment
# said the reason was that both Tempo charts are deprecated. That was true of
# the charts under the `grafana` Helm repo and incomplete as an account, because
# the maintained successors had already moved:
#
#   repo                                              chart              deprecated
#   https://grafana.github.io/helm-charts             tempo 1.24.4             yes
#   https://grafana.github.io/helm-charts             tempo-distributed 1.61.3 yes
#   https://grafana-community.github.io/helm-charts   tempo 2.2.4              NO
#   https://grafana-community.github.io/helm-charts   tempo-distributed 3.2.2  NO
#
# (read from each repository's index.yaml and `helm show chart` on 2026-08-19.
# The community repo also publishes `grafana` and `loki`, which matters for the
# log backend this repository has deferred.)
#
# So deprecation is NOT the reason. The reason is two properties that the
# maintained community chart still has, both confirmed against `tempo` 2.2.4
# (appVersion 2.10.8) on 2026-08-19:
#
#   - templates/_ports.tpl still dereferences
#     `.Values.tempo.receivers.jaeger.protocols.thrift_compact` with no guard,
#     so narrowing receivers to OTLP alone still fails outright with "nil
#     pointer evaluating interface {}.protocols". Its Service still publishes
#     ten ports, including Jaeger thrift over UDP and TCP, opencensus, and
#     zipkin, none of which anything here speaks.
#   - With persistence disabled it still mounts nothing at /var/tempo. The only
#     volume in the rendered StatefulSet is the config, so 24 hours of blocks
#     and WAL would land on the container's writable layer with no ceiling.
#
# The alternative, tempo-distributed 3.2.2, is maintained and current but
# renders six workloads at its defaults, three of them ingester replicas, next
# to a 5.6 GB model on one kind node.
#
# So this file does what platform/15-keycloak/keycloak.yaml does: one image,
# pinned by digest, with the config written out and read. Nothing about a
# single Tempo process needs a chart.
#
# > **Untried (2026-08-19):** every claim below about Tempo's runtime
# > behaviour. No cluster has run this.
# >
# > The config keys are not invented. Every one was read out of the config that
# > grafana-community/tempo 2.2.4 renders, whose appVersion is 2.10.8 - the same
# > version this image is - which carries `server.http_listen_port`,
# > `distributor.receivers.otlp.protocols.grpc.endpoint`,
# > `compactor.compaction.block_retention`, `usage_report.reporting_enabled`,
# > and `storage.trace.backend: local` with the `/var/tempo/traces` and
# > `/var/tempo/wal` paths used here. The one key that render does not exercise
# > is `ingester.max_block_duration`, because the chart emits `ingester: {}`;
# > that key is documented in the same chart's values.yaml at line 91.
# >
# > Keys existing is not the same as this file parsing. Confirm with
# > `kubectl -n observability logs deploy/tempo` and
# > `bats tests/smoke/05-observability.bats`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  namespace: observability
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    # OTLP over gRPC only. The single producer this repository will ever point
    # here is the OpenTelemetry Collector in otel-collector.yaml, which exports
    # OTLP. Jaeger, zipkin, and opencensus receivers are simply absent, which
    # the Helm chart would not allow.
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317

    # Short blocks so a trace becomes queryable in minutes rather than tens of
    # minutes. This is a debugging cluster, not a retention archive.
    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 24h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    # Default is true, which sends anonymous deployment-shape data to Grafana
    # Labs. This repository makes no outbound call a reader did not ask for.
    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
  labels: { app: tempo }
spec:
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      # The image runs as uid 10001 (read from the image config on 2026-08-19,
      # `.config.User` is "10001:10001"). fsGroup makes the emptyDir below
      # writable by that uid; without it Tempo cannot create its WAL and exits.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          # Pinned by digest with the version beside it, per versions.yaml's
          # images block. Value from versions.yaml images.tempo, read
          # 2026-08-19. The tag names the multi-arch index; the digest names
          # its linux/arm64 child, confirmed by reading the child's config blob
          # (os linux, architecture arm64).
          image: grafana/tempo:2.10.8@sha256:0a86a9663d64ba036b8a9dfee6a8a4747ad9faf4b176a1402826927bb841933f
          # Entrypoint is /tempo with no default cmd, read from the image
          # config the same day, so the config file has to be named here.
          args: ["-config.file=/conf/tempo.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: http, containerPort: 3200 }
          volumeMounts:
            - { name: config, mountPath: /conf, readOnly: true }
            - { name: data, mountPath: /var/tempo }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: tempo }
        # emptyDir with a bound, not a PersistentVolume. Traces are lost when
        # the pod restarts, and that is the right trade here for the same
        # reason it is right for Keycloak's dev mode: nothing depends on this
        # as a record. A trace is for looking at a problem happening now.
        #
        # sizeLimit is not decoration. The Helm chart mounts nothing at
        # /var/tempo when persistence is disabled (confirmed by rendering it,
        # 2026-08-19 - the only volume is the config), so Tempo would write 24
        # hours of blocks and WAL onto the container's writable layer with no
        # ceiling at all. Every emptyDir in this repository declares a limit;
        # see models/ornith-9b/overlays/local.
        - name: data
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  selector: { app: tempo }
  ports:
    # Only the two ports that exist. The chart's Service published eleven,
    # including UDP jaeger listeners nothing here speaks.
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: http, port: 3200, targetPort: 3200 }
