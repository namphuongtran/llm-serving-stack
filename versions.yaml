# Every version here was read from an upstream source on the date shown.
# Never edit a version without updating its `read` date.
meta:
  read: "2026-08-19"
  machine: "Apple M4, arm64, 32 GB"

kubernetes:
  # read 2026-08-19: no cluster was created (machine cannot spare the memory
  # Docker needs), so this is not the image a running cluster reported. It is
  # the default node image kind v0.32.0 (the version installed on this
  # machine, confirmed with `kind --version`) pins in its own release notes:
  #   https://github.com/kubernetes-sigs/kind/releases/tag/v0.32.0
  #   "The default node image is now
  #    kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
  # v1.36.1 is above the min_server floor of 1.32 below.
  kind_node: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"
  min_server: "1.32"     # floor named by Envoy AI Gateway prerequisites; we exceed it

charts:
  # read 2026-08-19 via `helm search repo <repo>/<chart> --versions | head -3`
  # after `helm repo add` against each upstream repo and `helm repo update`
  cert_manager: "v1.21.1"              # jetstack/cert-manager, must be >= v1.17.0 (KServe requirement)
  istio_base: "1.30.3"                 # istio/base
  istio_istiod: "1.30.3"               # istio/istiod
  istio_cni: "1.30.3"                  # istio/cni
  istio_ztunnel: "1.30.3"              # istio/ztunnel
  keda: "2.20.2"                       # kedacore/keda
  kube_prometheus_stack: "88.5.0"      # prometheus-community/kube-prometheus-stack
  otel_collector: "0.170.0"            # open-telemetry/opentelemetry-collector
  # read 2026-08-19 via `helm repo add prometheus-community ...` (already added
  # above) then `helm search repo prometheus-community/prometheus-pushgateway
  # --versions | head -3`. Backs the TTFT prober CronJob in
  # platform/30-observability/ttft-prober-cronjob.yaml: a CronJob pod exits
  # seconds after each measurement, so there is no long-lived target for
  # Prometheus to scrape a gauge from directly, and Pushgateway is the
  # standard fix for that shape of job.
  prometheus_pushgateway: "3.8.0"      # prometheus-community/prometheus-pushgateway
  argo_cd: "10.4.0"                    # argo/argo-cd
  kyverno: "3.8.2"                     # kyverno/kyverno

tools:
  # CI-installed command line tools. The repository's own rule forbids
  # floating pins, and .github/workflows/ci.yml used to break it twice: it
  # fetched kustomize's installer from `releases/latest` and resolved the
  # Kyverno CLI tag from the GitHub API at run time, so two different CI runs
  # of the same commit could use two different tool versions.
  #
  # read 2026-08-19:
  #   kustomize: `curl -s https://api.github.com/repos/kubernetes-sigs/kustomize/releases?per_page=30`
  #     -> newest tag beginning "kustomize/" is kustomize/v5.8.1. Asset
  #     kustomize_v5.8.1_linux_arm64.tar.gz returns HTTP 200.
  #   kyverno_cli: `curl -s https://api.github.com/repos/kyverno/kyverno/releases/latest`
  #     -> v1.18.2. Asset kyverno-cli_v1.18.2_linux_arm64.tar.gz returns HTTP
  #     200. This is also the CLI version policy/tests was verified against.
  #
  # ci.yml writes these two strings in literally (a workflow cannot read this
  # file before it has installed yq), so changing one here means changing it
  # there too.
  kustomize: "v5.8.1"
  kyverno_cli: "v1.18.2"

crds:
  # The criterion here is the version KServe v0.20.0 is built against, not the newest
  # upstream release (the newest release, v1.6.1, is a different question and was the
  # wrong pin recorded in an earlier pass of this file).
  # read 2026-08-19, two independent checks, both say v1.5.1:
  #   1. `curl -s https://raw.githubusercontent.com/kserve/kserve/v0.20.0/go.mod | grep gateway-api`
  #      -> `sigs.k8s.io/gateway-api v1.5.1` (ran this one myself, 2026-08-19)
  #   2. KServe v0.20.0 release notes: "deps: bump Gateway API to v1.5.1" (#5478)
  gateway_api: "v1.5.1"

kserve:
  version: "v0.20.0"     # released 2026-08-06, from kserve/kserve releases page
  # read 2026-08-19: `helm show chart oci://ghcr.io/kserve/charts/kserve --version v0.20.0` failed
  # (chart "kserve" does not exist under that path). Listed the actual chart directories with:
  #   curl -s "https://api.github.com/repos/kserve/kserve/contents/charts?ref=v0.20.0" | jq -r '.[].name'
  # which returned 11 entries (_common is an unpublished library chart, not a helm release).
  # Verified each of the remaining 10 resolves at v0.20.0 with
  # `helm show chart oci://ghcr.io/kserve/charts/<name> --version v0.20.0` (all succeeded).
  # Digest is the manifest digest each pull printed. None of these ten digests
  # were re-resolved in the 2026-08-19 fix round below; only which key they
  # live under changed.
  #
  # charts: the ORDERED INSTALL LIST for phase 1 Standard mode - not the
  # published-chart catalogue (that split in two, below, on 2026-08-19 review).
  # Confirmed against KServe's own Standard-mode install guide
  # (https://kserve.github.io/website/docs/admin-guide/kubernetes-deployment,
  # read 2026-08-19): it installs exactly two charts, in this order:
  #   helm install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version v0.20.0
  #   helm install kserve oci://ghcr.io/kserve/charts/kserve-resources --version v0.20.0 \
  #     --set kserve.controller.deploymentMode=Standard \
  #     --set kserve.controller.gateway.ingressGateway.enableGatewayApi=true \
  #     --set kserve.controller.gateway.ingressGateway.kserveGateway=kserve/kserve-ingress-gateway
  # (this repo passes the same settings via platform/20-kserve/values-kserve.yaml
  # instead of --set, and uses the legacy alias "RawDeployment" for
  # deploymentMode because tests/smoke/04-kserve.bats asserts that literal
  # string; kserve/pkg/constants normalises RawDeployment to Standard at read
  # time, so the two strings are behaviourally identical - confirmed by reading
  # kserve/pkg/constants/constants.go at tag v0.20.0.)
  charts:
    - "oci://ghcr.io/kserve/charts/kserve-crd:v0.20.0"                    # sha256:92deb742d22aaf295f4fd86d5c2595cbf08b14b6916760bfb16875b20761ee0d
    - "oci://ghcr.io/kserve/charts/kserve-resources:v0.20.0"              # sha256:956c4860374fd83fc5702f23905e37a60c0470783356c2fe8b2e8363ca20572b
  # charts_available: the rest of the v0.17+ split, published at v0.20.0 and
  # confirmed resolvable, but not part of the phase 1 install list above.
  # Kept here so a later phase does not have to re-discover the OCI refs or
  # re-resolve the digests.
  charts_available:
    # Alternate to kserve-crd above, not an addition: `helm template` on both
    # emits the identical six CRD names (clusterservingruntimes,
    # clusterstoragecontainers, inferencegraphs, inferenceservices,
    # servingruntimes, trainedmodels), confirmed 2026-08-19. Installing both
    # as separate helm releases collides on resource ownership - this is why
    # it is not in the install list.
    - "oci://ghcr.io/kserve/charts/kserve-crd-minimal:v0.20.0"            # sha256:826cddcbe0bd50b6841356a36ca7fcdccecb531025d5d8b66719aa12166669fb
    # ClusterServingRuntime definitions for KServe's built-in engines
    # (tensorflow, mlserver, sklearn, xgboost, huggingface, ...). Not needed
    # in phase 1: the engine here is the custom llamacpp-arm64 ServingRuntime
    # (runtimes/llamacpp-arm64), not one of the built-ins this chart configures.
    - "oci://ghcr.io/kserve/charts/kserve-runtime-configs:v0.20.0"        # sha256:819b32f79de7d4aeac01c248f7048d9e42e776aa3660b2e72ffc2268d11c64f1
    # LLMInferenceService CRD - the newer, multi-node/cache-aware-routing API.
    # Phase 3 territory (docs/adr/0002 and the design spec both scope
    # "KServe llmisvc" and cache-aware routing to phase 3); not installed here.
    - "oci://ghcr.io/kserve/charts/kserve-llmisvc-crd:v0.20.0"            # sha256:751c62bd15df1bdae62a3db6e1ef6fe769c1432d934c3a784d0e046e75ff732f
    # Alternate to kserve-llmisvc-crd, same reasoning as the crd/crd-minimal
    # pair above (same CRD names, not an addition). Phase 3, if ever.
    - "oci://ghcr.io/kserve/charts/kserve-llmisvc-crd-minimal:v0.20.0"    # sha256:c95d8319d7d0e7fd0c82d890608ce473364c284790054a3789e5bd64df356f83
    # Controller resources for LLMInferenceService. Phase 3, alongside the
    # llmisvc CRD above; unused while models are served as InferenceService.
    - "oci://ghcr.io/kserve/charts/kserve-llmisvc-resources:v0.20.0"      # sha256:cc3a85dca41224fc5a258c96d9a98eecb15d5de7523fc68af17828e09368454c
    # LocalModelCache CRD: a node-local weight cache so repeated pods on the
    # same node reuse a downloaded model instead of re-pulling it. Not needed
    # for a single laptop-sized model in phase 1.
    - "oci://ghcr.io/kserve/charts/kserve-localmodel-crd:v0.20.0"         # sha256:d9df3e56624b15c78604cd097b3ec02806570be7e439b25cbbb0f707a0c8aea7
    # Alternate to kserve-localmodel-crd, same reasoning (same CRD names, not
    # an addition).
    - "oci://ghcr.io/kserve/charts/kserve-localmodel-crd-minimal:v0.20.0" # sha256:700c7fb39a22d47314e9998c43563b6b3d77eaf375dbf7ed194f9bfb4c716cbb
    # Controller and node agent for the local model cache above. Unused while
    # phase 1 runs a single model on a single-node kind cluster.
    - "oci://ghcr.io/kserve/charts/kserve-localmodel-resources:v0.20.0"   # sha256:854742bba1c8cbf8013d1f50750e707563a7d2c5358e36c3857dda36935a6686

kuadrant:
  # read 2026-08-19: `helm repo add kuadrant https://kuadrant.io/helm-charts && helm repo update kuadrant
  # && helm search repo kuadrant --versions | head -5`. Repo: https://kuadrant.io/helm-charts
  # This is a classic repo reference, not an OCI one: "name:version" does not resolve
  # (`helm show chart "kuadrant/kuadrant-operator:1.5.2"` fails with "no chart name
  # found"). Split into chart + version, like the entries under `charts:`, and verified
  # with `helm show chart kuadrant/kuadrant-operator --version 1.5.2` (succeeded, printed
  # the chart's Chart.yaml).
  operator_chart: "kuadrant/kuadrant-operator"
  operator_chart_version: "1.5.2"

images:
  # FORM: name:tag@sha256:digest. The tag was added to every entry on
  # 2026-08-19, because a bare digest tells a reader nothing about which
  # version they are running.
  #
  # The digest is what pulls. A container runtime ignores the tag whenever a
  # digest is present, so adding one changed nothing about what runs. The tag
  # is a label for people.
  #
  # THE TAG AND THE DIGEST DO NOT NAME THE SAME OBJECT, and that is expected,
  # not a mistake. The tag names the multi-architecture index. The digest names
  # that index's linux/arm64 child, which is what this repository has always
  # pinned and why CI runs on ubuntu-24.04-arm (docs/adr/0005). Anyone checking
  # the two against each other will find they differ. They are meant to.
  #
  # Every tag below was verified on 2026-08-19 by fetching the tag's index
  # straight from its registry over HTTPS and confirming the pinned digest is
  # one of its children. No Docker daemon was involved, so the check is
  # repeatable on a machine that cannot start one. The shape of the check, for
  # a Docker Hub image:
  #   TOK=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:<repo>:pull" | jq -r .token)
  #   curl -s -H "Authorization: Bearer $TOK" \
  #        -H "Accept: application/vnd.oci.image.index.v1+json" \
  #        "https://registry-1.docker.io/v2/<repo>/manifests/<tag>" \
  #     | jq -r '.manifests[].digest'
  # ghcr.io and quay.io answer the same shape; ghcr.io's token endpoint is
  # https://ghcr.io/token?scope=repository:<repo>:pull&service=ghcr.io and
  # quay.io needs no token for a public repository.
  #
  # Pinning the INDEX digest instead, so that tag and digest agree, was
  # considered on 2026-08-19 and rejected. It would change what gets pulled and
  # would undo the deliberate arm64-only pinning. That is a phase 2 question
  # about amd64 GPU nodes, not a readability fix.
  #
  # This block is the single source of truth for image digests, but not the
  # only place they appear: an Argo CD Application is one git object and
  # cannot read this file, so clusters/local-kind/apps/30-observability.yaml
  # carries a rendered copy of `otel_collector`'s digest in its inline Helm
  # values. That duplication is accepted, not an oversight - changing a
  # digest here means grepping for the old one and updating every rendered
  # copy in a values file or Application.
  #
  # read 2026-08-19 via `docker buildx imagetools inspect <ref>`; digest is the linux/arm64
  # manifest digest, confirmed present in the same inspect output for both images.
  llamacpp_server: "ghcr.io/ggml-org/llama.cpp:server-b10481@sha256:5be603b8cbf1ee9e078232ae5e1d02794e7540e210299b53bac04cbc6debc77b"
  keycloak: "quay.io/keycloak/keycloak:26.7.1@sha256:89d56312ace1d9b0bf8168f1a92ea135ba185d2844285f7651cb50774e47c1d8"
  # read 2026-08-19 via `docker buildx imagetools inspect --format '{{json .Image}}'
  # ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector@sha256:...`
  # (registry-only, no daemon needed); architecture field is "arm64" directly.
  # Tag chosen to match the pinned chart's own appVersion (0.158.0 - see
  # charts.otel_collector above and its own comment). This is the "core"
  # distribution (binary name `otelcol`, not `otelcol-contrib`/`otelcol-k8s`):
  # platform/30-observability/otel-collector.yaml only configures the otlp
  # receiver, batch and attributes processors, and the debug exporter, all of
  # which ship in core, so the smaller core image is enough.
  otel_collector: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.158.0@sha256:0969430778574e768e0a262fb940c2955b0b13587d2467f3e4876cf6e8f0461c"
  # read 2026-08-19 via `docker buildx imagetools inspect curlimages/curl:8.21.0`
  # (talks to the registry, no docker daemon needed); digest is the
  # linux/arm64/v8 manifest digest from that inspect output. Used by the
  # fetch-weights init container in models/ornith-9b/overlays/local, pinned by
  # digest rather than :latest per the repository-wide digest-pinning rule.
  curl: "curlimages/curl:8.21.0@sha256:56bc0130aabaada5c04bb18d8d7f75e7a78fbcaa38ad44e1811c8c7720606d84"
  # read 2026-08-19 via `docker buildx imagetools inspect ealen/echo-server:0.9.2`
  # (registry-only, no docker daemon needed); digest is the linux/arm64
  # manifest digest from that inspect output. Used only by the throwaway
  # backend tests/smoke/02-gateway.bats creates to prove traffic reaches a
  # pod through the gateway. It is pinned here, rather than referenced as a
  # floating tag inside the test, because namespace llm enforces
  # policy/disallow-floating-tags.yaml: the fixture the test creates has to
  # satisfy the same three policies every other workload in that namespace
  # does, or admission rejects it and the test fails 120 seconds later at a
  # curl loop with no stated cause.
  echo_server: "ealen/echo-server:0.9.2@sha256:74afa5ffd1f0cd81bea9a3ef2f27341dc7e93ed221f2817a2119c230c25cc8a2"
  # read 2026-08-19 over HTTPS against Docker Hub, no daemon: fetched the
  # index for tag 2.9.0, took the linux/arm64 child, then read that child's
  # config blob and confirmed `os: linux`, `architecture: arm64`. The same
  # blob gave the two facts platform/30-observability/tempo.yaml depends on -
  # entrypoint ["/tempo"] with no default cmd, and user "10001:10001".
  #
  # 2.9.0 is the appVersion of both Grafana Tempo Helm charts, and neither
  # chart is used: both are marked `deprecated: true` in their own Chart.yaml
  # (checked the same day), and grafana/tempo cannot render with receivers
  # narrowed to OTLP. tempo.yaml's header records the full reasoning.
  tempo: "grafana/tempo:2.9.0@sha256:0ea6e47231c1c993abed41bddf67d524ff5508954463759f0bcc1e97543f3386"
